<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Fox Invaders: 80s Arcade Edition</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #08080c;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameContainer {
            position: relative;
            width: min(95vw, calc(94vh * 4 / 3), 800px);
            aspect-ratio: 4 / 3;
            border: 4px solid #3060ff;
            box-shadow: 0 0 0 4px #101830, 0 12px 40px rgba(0, 0, 0, 0.9);
            background: #000000;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Scanlines sutis de monitor arcade CRT dos anos 80 */
        #crtOverlay {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0) 2px,
                rgba(0, 0, 0, 0.25) 3px,
                rgba(0, 0, 0, 0.25) 4px
            );
            pointer-events: none;
            z-index: 4;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 3;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hud-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .hud-label {
            font-size: clamp(10px, 1.5vw, 13px);
            color: #ff2040;
        }

        .hud-val {
            font-size: clamp(14px, 2.2vw, 18px);
            color: #ffffff;
        }

        #controlsBar {
            position: absolute;
            top: 52px;
            right: 16px;
            display: flex;
            gap: 6px;
            z-index: 6;
        }

        .mini-btn {
            background: #000000;
            border: 2px solid #00e8ff;
            color: #00e8ff;
            font-family: inherit;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            cursor: pointer;
            margin: 0;
            text-transform: uppercase;
        }

        .mini-btn:hover {
            background: #00e8ff;
            color: #000000;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.94);
            padding: 28px 34px;
            border: 4px solid #ff2040;
            outline: 4px solid #3060ff;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 8;
            width: min(88%, 420px);
        }

        h1 {
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffe000;
            font-size: clamp(20px, 3vw, 26px);
        }

        .subtitle {
            color: #00e8ff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        p {
            margin: 0;
            color: #e0e0e0;
            font-size: 13px;
            line-height: 1.5;
        }

        .action-btn {
            margin-top: 6px;
            padding: 12px 24px;
            background: #000000;
            border: 3px solid #00ff44;
            color: #00ff44;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .action-btn:hover {
            background: #00ff44;
            color: #000000;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="ui">
            <div class="hud-col">
                <div class="hud-label">1UP</div>
                <div class="hud-val" id="scoreEl">000000</div>
            </div>
            <div class="hud-col" style="text-align: center;">
                <div class="hud-label" style="color: #00e8ff;">HIGH SCORE</div>
                <div class="hud-val" style="color: #ffe000;" id="hiScoreEl">000000</div>
            </div>
            <div class="hud-col" style="text-align: right;">
                <div class="hud-label" style="color: #00ff44;">STAGE</div>
                <div class="hud-val" id="waveEl">01</div>
            </div>
        </div>

        <div id="controlsBar">
            <button type="button" class="mini-btn" id="muteBtn">SOM: ON</button>
            <button type="button" class="mini-btn" id="pauseBtn">PAUSA</button>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="crtOverlay"></div>

        <div id="startScreen">
            <div class="subtitle">1980s PIXEL ARCADE EDITION</div>
            <h1>STAR FOX INVADERS</h1>
            <p>
                Use <strong>SETAS</strong> ou <strong>A / D</strong> para mover.<br>
                <strong>ESPAÇO</strong> ou <strong>CLIQUE</strong> para atirar.<br>
                <strong>P</strong> Pausa &nbsp;|&nbsp; <strong>M</strong> Som
            </p>
            <button type="button" class="action-btn" id="startBtn">INSERT COIN / START</button>
            <div style="font-size:11px; color:#ffe000;">OU PRESSIONE ENTER / ESPAÇO</div>
        </div>

        <div id="gameOverScreen" class="hidden">
            <h1 id="goTitle" style="color: #ff2040;">GAME OVER</h1>
            <p id="finalScore">SCORE: 0</p>
            <p id="finalStats" style="color: #00e8ff; font-size: 13px;"></p>
            <button type="button" class="action-btn" id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>

<script>
(() => {
    'use strict';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const width = 800;
    const height = 600;
    const PIXEL = 3;

    // =========================================================================
    // ÁUDIO 8-BIT CHIPTUNE (WEB AUDIO API SEGURO)
    // =========================================================================
    const SFX = {
        ctx: null,
        muted: false,
        stepIdx: 0,
        init() {
            try {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) this.ctx = new AC();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            } catch (e) { this.ctx = null; }
        },
        tone(f1, f2, dur, type = 'square', vol = 0.08, delay = 0) {
            if (this.muted || !this.ctx) return;
            try {
                const t = this.ctx.currentTime + delay;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(f1, t);
                if (f2 !== f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
                g.gain.setValueAtTime(vol, t);
                g.gain.exponentialRampToValueAtTime(0.002, t + dur);
                osc.connect(g);
                g.connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + dur + 0.01);
            } catch (e) {}
        },
        shoot() { this.tone(980, 240, 0.09, 'square', 0.06); },
        hitArmor() { this.tone(520, 780, 0.07, 'square', 0.07); },
        explode() {
            this.tone(220, 45, 0.18, 'sawtooth', 0.09);
            this.tone(140, 35, 0.20, 'square', 0.06, 0.03);
        },
        ufo() { this.tone(660, 880, 0.10, 'triangle', 0.05); },
        step() {
            const notes = [110, 98, 92, 82];
            const f = notes[this.stepIdx % 4];
            this.stepIdx++;
            this.tone(f, f * 0.9, 0.06, 'square', 0.07);
        },
        stageStart() {
            const melody = [
                [523, 0.00], [659, 0.09], [784, 0.18], [1046, 0.27],
                [784, 0.38], [1046, 0.48]
            ];
            melody.forEach(([f, d]) => this.tone(f, f, 0.09, 'square', 0.07, d));
        },
        stageClear() {
            const melody = [
                [659, 0.00], [784, 0.09], [988, 0.18], [1318, 0.27], [1568, 0.38]
            ];
            melody.forEach(([f, d]) => this.tone(f, f, 0.10, 'square', 0.07, d));
        }
    };

    // =========================================================================
    // SPRITES PIXEL ART ANOS 80
    // =========================================================================
    const PALETTES = {
        PLAYER:    { '.': null, 'W': '#ffffff', 'S': '#b0c4de', 'B': '#2068ff', 'C': '#00e8ff', 'R': '#ff2040' },
        BOSS_FULL: { '.': null, 'G': '#00ff55', 'D': '#009933', 'Y': '#ffe000', 'R': '#ff2040', 'W': '#ffffff' },
        BOSS_HIT:  { '.': null, 'G': '#3070ff', 'D': '#1838a0', 'Y': '#ff40ff', 'R': '#ffffff', 'W': '#00e8ff' },
        CRAB:      { '.': null, 'M': '#ff2060', 'C': '#00e8ff', 'W': '#ffffff' },
        BEE:       { '.': null, 'Y': '#ffe000', 'B': '#3078ff', 'R': '#ff2040', 'W': '#ffffff' },
        UFO:       { '.': null, 'R': '#ff2040', 'Y': '#ffe000', 'C': '#00e8ff', 'W': '#ffffff' }
    };

    const SPRITES = {
        PLAYER: [
            '......W......',
            '.....WSW.....',
            '.....WCW.....',
            '....WCCCW....',
            '..B.WSSSW.B..',
            '..B.WWSWW.B..',
            '.BBWWWWWWWBB.',
            'RBBWWWSWWWBBR',
            'RB.WW.R.WW.BR',
            'R..W.....W..R'
        ],
        BOSS: [
            [
                '....GGGG....',
                '..GGGGGGGG..',
                '.GGYYGGYYGG.',
                'GGGGGGGGGGGG',
                'GGDDRRRRGGDD',
                '.GGGGGGGGGG.',
                '..GG.GG.GG..',
                '.GG..GG..GG.',
                'GG........GG'
            ],
            [
                '....GGGG....',
                '..GGGGGGGG..',
                '.GGYYGGYYGG.',
                'GGGGGGGGGGGG',
                'GGDDRRRRGGDD',
                '.GGGGGGGGGG.',
                '..GG.GG.GG..',
                '..G..GG..G..',
                '...G....G...'
            ]
        ],
        CRAB: [
            [
                '..C.....C..',
                '...C...C...',
                '..MMMMMMM..',
                '.MMWMMMWMM.',
                'MMMMMMMMMMM',
                'M.MMMMMMM.M',
                'M.M.....M.M',
                '...MM.MM...'
            ],
            [
                '..C.....C..',
                'M..C...C..M',
                'M.MMMMMMM.M',
                'MMMWMMMWMMM',
                'MMMMMMMMMMM',
                '.MMMMMMMMM.',
                '..M.....M..',
                '.M.......M.'
            ]
        ],
        BEE: [
            [
                '...YYYYY...',
                '.YYYYYYYYY.',
                'YYYYYYYYYYY',
                'YYYRYYYRYYY',
                'BBBBBBBBBBB',
                '..BB...BB..',
                '.BB..B..BB.',
                'BB.......BB'
            ],
            [
                '...YYYYY...',
                '.YYYYYYYYY.',
                'YYYYYYYYYYY',
                'YYYRYYYRYYY',
                'BBBBBBBBBBB',
                '..BB...BB..',
                '.B..BBB..B.',
                '..B.....B..'
            ]
        ],
        UFO: [
            '....RRRR....',
            '..RRRRRRRR..',
            '.RRYYRRYYRR.',
            'RRRRRRRRRRRR',
            'CCWWWWWWWWCC',
            '.RR..RR..RR.'
        ]
    };

    function drawPixelSprite(grid, palette, cx, cy, pxSize = PIXEL) {
        const rows = grid.length;
        const cols = grid[0].length;
        const startX = Math.round(cx - (cols * pxSize) / 2);
        const startY = Math.round(cy - (rows * pxSize) / 2);

        for (let r = 0; r < rows; r++) {
            const line = grid[r];
            for (let c = 0; c < cols; c++) {
                const col = palette[line[c]];
                if (!col) continue;
                ctx.fillStyle = col;
                ctx.fillRect(startX + c * pxSize, startY + r * pxSize, pxSize, pxSize);
            }
        }
    }

    // =========================================================================
    // ESTADO DO JOGO
    // =========================================================================
    let gameState = 'START';
    let pausedFromState = 'PLAYING';
    let score = 0;
    let hiScore = 0;
    try { hiScore = Number(window.localStorage.getItem('sfx80s_hi') || 0) || 0; } catch (e) {}

    let lives = 3;
    let wave = 1;
    let frames = 0;
    let enemyDir = 1;
    let marchTimer = 0;
    let marchFrame = 0;
    let enemyShootTimer = 0;
    let stateTimer = 0;
    let starWarp = 1;
    let shotsFired = 0;
    let shotsHit = 0;
    let stagePerfect = false;
    let ufo = null;
    let ufoTimer = 500;

    let player = null;
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let bunkerBlocks = [];
    let particles = [];
    let popups = [];
    let stars = [];

    const keys = {};
    const mouse = { down: false };

    function initStars() {
        const starColors = ['#ffffff', '#ff2040', '#00e8ff', '#ffe000', '#3068ff'];
        stars = [];
        for (let i = 0; i < 110; i++) {
            stars.push({
                x: Math.floor(Math.random() * width),
                y: Math.floor(Math.random() * height),
                speed: Math.random() * 1.4 + 0.5,
                color: starColors[i % starColors.length],
                blinkPhase: Math.floor(Math.random() * 60)
            });
        }
    }

    // =========================================================================
    // ENTIDADES
    // =========================================================================
    class Player {
        constructor() {
            this.width = 13 * PIXEL;
            this.height = 10 * PIXEL;
            this.x = width / 2;
            this.y = height - 62;
            this.speed = 6;
            this.lastShot = 0;
            this.invuln = 0;
        }

        update() {
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) this.x -= this.speed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) this.x += this.speed;

            const halfW = this.width / 2 + 10;
            if (this.x < halfW) this.x = halfW;
            if (this.x > width - halfW) this.x = width - halfW;

            if (this.invuln > 0) this.invuln--;

            if ((mouse.down || keys[' '] || keys['Spacebar']) &&
                (gameState === 'PLAYING' || (gameState === 'STAGE_INTRO' && stateTimer > 20))) {
                this.shoot();
            }
        }

        shoot() {
            const now = Date.now();
            if (now - this.lastShot > 195) {
                bullets.push(new Bullet(this.x - 13, this.y - 12, 0, -11, '#00e8ff', true));
                bullets.push(new Bullet(this.x + 13, this.y - 12, 0, -11, '#00e8ff', true));
                shotsFired += 2;
                SFX.shoot();
                this.lastShot = now;
            }
        }

        draw() {
            if (this.invuln > 0 && Math.floor(frames / 4) % 2 === 0) return;
            drawPixelSprite(SPRITES.PLAYER, PALETTES.PLAYER, this.x, this.y, PIXEL);

            const f = Math.floor(frames / 4) % 2;
            ctx.fillStyle = f === 0 ? '#ffe000' : '#ff2040';
            ctx.fillRect(Math.round(this.x - 3), Math.round(this.y + 15), 6, f === 0 ? 6 : 9);
        }
    }

    class BunkerBlock {
        constructor(x, y, size) {
            this.x = x;
            this.y = y;
            this.size = size;
            this.hp = 2;
        }

        hit() {
            this.hp--;
            return this.hp <= 0;
        }

        draw() {
            ctx.fillStyle = this.hp === 2 ? '#00ee44' : '#008828';
            ctx.fillRect(this.x, this.y, this.size, this.size);
            if (this.hp === 1) {
                ctx.fillStyle = '#000000';
                ctx.fillRect(this.x + 2, this.y + 2, 2, 2);
                ctx.fillRect(this.x + 5, this.y + 4, 2, 2);
            }
        }
    }

    class Bullet {
        constructor(x, y, vx, vy, color, isPlayer) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.color = color;
            this.isPlayer = isPlayer;
            this.markedForDeletion = false;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.y < -12 || this.y > height + 12) {
                this.markedForDeletion = true;
            }
        }

        draw() {
            const rx = Math.round(this.x - 2);
            const ry = Math.round(this.y - 6);
            if (this.isPlayer) {
                ctx.fillStyle = this.color;
                ctx.fillRect(rx, ry, 4, 12);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(rx + 1, ry + 2, 2, 8);
            } else {
                const zig = (Math.floor(frames / 4) % 2 === 0) ? -1 : 1;
                ctx.fillStyle = '#ff2040';
                ctx.fillRect(rx + zig, ry, 4, 5);
                ctx.fillRect(rx - zig, ry + 5, 4, 5);
                ctx.fillStyle = '#ffe000';
                ctx.fillRect(rx + 1, ry + 3, 2, 4);
            }
        }
    }

    class Enemy {
        constructor(targetX, targetY, type, swoopIndex) {
            this.targetX = targetX;
            this.targetY = targetY;
            this.type = type;
            this.hp = type === 2 ? 2 : 1;
            this.points = type === 2 ? 300 : (type === 1 ? 150 : 100);
            this.width = type === 2 ? 12 * PIXEL : 11 * PIXEL;
            this.height = type === 2 ? 9 * PIXEL : 8 * PIXEL;

            // Entrada em curva rápida estilo Galaga
            this.entering = true;
            this.delay = swoopIndex * 2;
            this.progress = 0;
            const fromLeft = (swoopIndex % 2 === 0);
            this.startX = fromLeft ? -40 : width + 40;
            this.startY = 90 + (swoopIndex % 4) * 35;
            this.ctrlX = fromLeft ? width * 0.78 : width * 0.22;
            this.ctrlY = height * 0.45;
            this.x = this.startX;
            this.y = this.startY;
        }

        updateEntrance() {
            if (!this.entering) return;
            if (this.delay > 0) {
                this.delay--;
                return;
            }
            this.progress = Math.min(1, this.progress + 0.036);
            const t = this.progress;
            const inv = 1 - t;
            this.x = Math.round(inv * inv * this.startX + 2 * inv * t * this.ctrlX + t * t * this.targetX);
            this.y = Math.round(inv * inv * this.startY + 2 * inv * t * this.ctrlY + t * t * this.targetY);

            if (this.progress >= 1) {
                this.x = this.targetX;
                this.y = this.targetY;
                this.entering = false;
            }
        }

        takeDamage() {
            this.hp--;
            return this.hp <= 0;
        }

        draw() {
            if (this.entering && this.delay > 0) return;
            const frame = marchFrame;
            let grid, pal;
            if (this.type === 2) {
                grid = SPRITES.BOSS[frame];
                pal = this.hp >= 2 ? PALETTES.BOSS_FULL : PALETTES.BOSS_HIT;
            } else if (this.type === 1) {
                grid = SPRITES.CRAB[frame];
                pal = PALETTES.CRAB;
            } else {
                grid = SPRITES.BEE[frame];
                pal = PALETTES.BEE;
            }
            drawPixelSprite(grid, pal, this.x + this.width / 2, this.y + this.height / 2, PIXEL);
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = (Math.random() < 0.5 ? 3 : 6);
            const a = Math.random() * Math.PI * 2;
            const sp = Math.random() * 4 + 1.5;
            this.vx = Math.cos(a) * sp;
            this.vy = Math.sin(a) * sp;
            this.color = color;
            this.life = 22 + Math.floor(Math.random() * 14);
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life--;
        }

        draw() {
            if (this.life < 6 && this.life % 2 === 0) return;
            ctx.fillStyle = this.color;
            ctx.fillRect(Math.round(this.x), Math.round(this.y), this.size, this.size);
        }
    }

    // =========================================================================
    // SISTEMA DE JOGO & TRANSIÇÕES
    // =========================================================================
    function updateHUD() {
        if (score > hiScore) {
            hiScore = score;
            try { window.localStorage.setItem('sfx80s_hi', String(hiScore)); } catch (e) {}
        }
        document.getElementById('scoreEl').innerText = String(score).padStart(6, '0');
        document.getElementById('hiScoreEl').innerText = String(hiScore).padStart(6, '0');
        document.getElementById('waveEl').innerText = String(wave).padStart(2, '0');
    }

    function createBunkers() {
        bunkerBlocks = [];
        const pattern = [
            '.######.',
            '########',
            '########',
            '###..###',
            '##....##'
        ];
        const blockSize = 8;
        const count = 4;
        const cols = pattern[0].length;
        const bWidth = cols * blockSize;
        const bunkerY = height - 144;
        const spacing = width / (count + 1);

        for (let i = 0; i < count; i++) {
            const startX = Math.round(spacing * (i + 1) - bWidth / 2);
            for (let r = 0; r < pattern.length; r++) {
                for (let c = 0; c < cols; c++) {
                    if (pattern[r][c] === '#') {
                        bunkerBlocks.push(new BunkerBlock(
                            startX + c * blockSize,
                            bunkerY + r * blockSize,
                            blockSize
                        ));
                    }
                }
            }
        }
    }

    function startStageIntro() {
        gameState = 'STAGE_INTRO';
        stateTimer = 0;
        starWarp = 5.5;
        enemyDir = 1;
        marchTimer = 0;
        marchFrame = 0;
        enemyBullets = [];
        bullets = [];
        shotsFired = 0;
        shotsHit = 0;
        ufo = null;
        SFX.stageStart();

        enemies = [];
        const rows = Math.min(5, 4 + Math.floor((wave - 1) / 3));
        const cols = Math.min(10, 7 + Math.floor(wave / 2));
        const gapX = 56;
        const gapY = 42;
        const totalW = (cols - 1) * gapX + 36;
        const startX = Math.round((width - totalW) / 2);
        const startY = 74;

        let idx = 0;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let type = 0;
                if (r === 1 || r === 2) type = 1;
                if (r === 0) type = 2;

                enemies.push(new Enemy(
                    startX + c * gapX,
                    startY + r * gapY,
                    type,
                    idx++
                ));
            }
        }
        updateHUD();
    }

    function initGame() {
        score = 0;
        lives = 3;
        wave = 1;
        player = new Player();
        particles = [];
        popups = [];
        ufoTimer = 450;

        createBunkers();
        startStageIntro();

        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
    }

    function spawnExplosion(x, y, color, count = 12) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function addPopup(x, y, text, color = '#ffe000') {
        popups.push({ x, y, text, color, life: 45 });
    }

    function hurtPlayer() {
        if (player.invuln > 0) return;
        lives--;
        player.invuln = 100;
        SFX.explode();
        spawnExplosion(player.x, player.y, '#00e8ff', 16);
        spawnExplosion(player.x, player.y, '#ffe000', 8);

        if (lives <= 0) {
            endGame();
        }
    }

    function checkCollisions() {
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            if (b.markedForDeletion) continue;

            for (let k = bunkerBlocks.length - 1; k >= 0; k--) {
                const blk = bunkerBlocks[k];
                if (b.x + 2 > blk.x && b.x - 2 < blk.x + blk.size &&
                    b.y + 6 > blk.y && b.y - 6 < blk.y + blk.size) {
                    if (blk.hit()) bunkerBlocks.splice(k, 1);
                    spawnExplosion(b.x, b.y, '#00ee44', 4);
                    b.markedForDeletion = true;
                    break;
                }
            }
            if (b.markedForDeletion) continue;

            if (ufo && b.x + 2 > ufo.x - 18 && b.x - 2 < ufo.x + 18 &&
                b.y + 6 > ufo.y - 9 && b.y - 6 < ufo.y + 9) {
                score += ufo.pts;
                shotsHit++;
                SFX.explode();
                spawnExplosion(ufo.x, ufo.y, '#ff2040', 18);
                addPopup(ufo.x, ufo.y, `${ufo.pts}`, '#ff2040');
                ufo = null;
                b.markedForDeletion = true;
                updateHUD();
                continue;
            }

            for (let j = enemies.length - 1; j >= 0; j--) {
                const e = enemies[j];
                if (e.entering && e.delay > 0) continue;
                if (b.x + 2 > e.x && b.x - 2 < e.x + e.width &&
                    b.y + 6 > e.y && b.y - 6 < e.y + e.height) {
                    shotsHit++;
                    if (e.takeDamage()) {
                        const col = e.type === 2 ? '#00ff55' : (e.type === 1 ? '#ff2060' : '#ffe000');
                        spawnExplosion(e.x + e.width / 2, e.y + e.height / 2, col, 14);
                        score += e.points;
                        addPopup(e.x + e.width / 2, e.y, `${e.points}`, col);
                        enemies.splice(j, 1);
                        SFX.explode();
                        updateHUD();
                    } else {
                        SFX.hitArmor();
                        spawnExplosion(b.x, b.y, '#ffffff', 5);
                    }
                    b.markedForDeletion = true;
                    break;
                }
            }
        }

        const pLeft = player.x - player.width / 2 + 4;
        const pRight = player.x + player.width / 2 - 4;
        const pTop = player.y - player.height / 2 + 4;
        const pBottom = player.y + player.height / 2 - 4;

        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            const eb = enemyBullets[i];

            let hitBunker = false;
            for (let k = bunkerBlocks.length - 1; k >= 0; k--) {
                const blk = bunkerBlocks[k];
                if (eb.x + 2 > blk.x && eb.x - 2 < blk.x + blk.size &&
                    eb.y + 5 > blk.y && eb.y - 5 < blk.y + blk.size) {
                    if (blk.hit()) bunkerBlocks.splice(k, 1);
                    spawnExplosion(eb.x, eb.y, '#00ee44', 4);
                    eb.markedForDeletion = true;
                    hitBunker = true;
                    break;
                }
            }
            if (hitBunker) continue;

            if (eb.x + 2 > pLeft && eb.x - 2 < pRight &&
                eb.y + 5 > pTop && eb.y - 5 < pBottom) {
                eb.markedForDeletion = true;
                hurtPlayer();
                if (gameState !== 'PLAYING') return;
            }
        }

        if (gameState === 'PLAYING') {
            for (const e of enemies) {
                for (let k = bunkerBlocks.length - 1; k >= 0; k--) {
                    const blk = bunkerBlocks[k];
                    if (e.x < blk.x + blk.size && e.x + e.width > blk.x &&
                        e.y < blk.y + blk.size && e.y + e.height > blk.y) {
                        spawnExplosion(blk.x + 4, blk.y + 4, '#00ee44', 3);
                        bunkerBlocks.splice(k, 1);
                    }
                }
                if (e.x < pRight && e.x + e.width > pLeft &&
                    e.y < pBottom && e.y + e.height > pTop) {
                    hurtPlayer();
                    if (gameState !== 'PLAYING') return;
                }
                if (e.y + e.height >= player.y + player.height / 2) {
                    endGame();
                    return;
                }
            }
        }
    }

    function triggerStageClear() {
        gameState = 'STAGE_CLEAR';
        stateTimer = 0;
        starWarp = 8.0;
        enemyBullets = [];
        ufo = null;
        stagePerfect = shotsFired > 0 && shotsHit >= shotsFired * 0.6;
        const clearBonus = wave * 200 + (stagePerfect ? 1000 : 0);
        score += clearBonus;
        updateHUD();
        SFX.stageClear();
    }

    function endGame() {
        gameState = 'GAMEOVER';
        mouse.down = false;
        const screen = document.getElementById('gameOverScreen');
        const ratio = shotsFired > 0 ? Math.round((shotsHit / shotsFired) * 100) : 0;
        document.getElementById('finalScore').innerText = `SCORE: ${score}  |  STAGE: ${wave}`;
        document.getElementById('finalStats').innerText = `DISPAROS: ${shotsFired}  |  ACERTOS: ${shotsHit} (${ratio}%)`;
        screen.classList.remove('hidden');
    }

    function drawBottomArcadeBar() {
        const miniCount = Math.max(0, lives - 1);
        for (let i = 0; i < miniCount; i++) {
            drawPixelSprite(SPRITES.PLAYER, PALETTES.PLAYER, 26 + i * 28, height - 20, 2);
        }

        let rem = wave;
        let bx = width - 22;
        const by = height - 26;

        while (rem >= 10) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(bx, by, 3, 18);
            ctx.fillStyle = '#ff2040';
            ctx.fillRect(bx + 3, by, 14, 10);
            ctx.fillStyle = '#ffe000';
            ctx.fillRect(bx + 6, by + 3, 6, 4);
            bx -= 22;
            rem -= 10;
        }
        while (rem >= 5) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(bx, by + 2, 2, 16);
            ctx.fillStyle = '#3070ff';
            ctx.fillRect(bx + 2, by + 2, 11, 8);
            ctx.fillStyle = '#ffe000';
            ctx.fillRect(bx + 4, by + 4, 5, 4);
            bx -= 18;
            rem -= 5;
        }
        while (rem >= 1) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(bx, by + 4, 2, 14);
            ctx.fillStyle = '#ff2040';
            ctx.fillRect(bx + 2, by + 4, 8, 6);
            bx -= 14;
            rem -= 1;
        }
    }

    // =========================================================================
    // LOOP PRINCIPAL
    // =========================================================================
    function loop() {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, width, height);

        const targetWarp = (gameState === 'STAGE_CLEAR') ? 8.5 : (gameState === 'STAGE_INTRO' ? 3.5 : 1.0);
        starWarp += (targetWarp - starWarp) * 0.06;

        for (const s of stars) {
            s.y += s.speed * starWarp;
            if (s.y > height) {
                s.y = -4;
                s.x = Math.floor(Math.random() * width);
            }
            if (starWarp < 1.8 && ((frames + s.blinkPhase) % 45 < 10)) continue;
            ctx.fillStyle = s.color;
            const streakH = starWarp > 1.8 ? Math.min(20, Math.round(starWarp * 2.4)) : 2;
            ctx.fillRect(Math.round(s.x), Math.round(s.y), 2, streakH);
        }

        if (gameState === 'STAGE_INTRO') {
            stateTimer++;
            player.update();

            let stillEntering = false;
            for (const e of enemies) {
                e.updateEntrance();
                if (e.entering) stillEntering = true;
            }
            if (frames % 14 === 0) marchFrame = 1 - marchFrame;

            bullets.forEach(b => b.update());
            bullets = bullets.filter(b => !b.markedForDeletion);
            particles.forEach(p => p.update());
            particles = particles.filter(p => p.life > 0);

            checkCollisions();

            bunkerBlocks.forEach(blk => blk.draw());
            bullets.forEach(b => b.draw());
            enemies.forEach(e => e.draw());
            player.draw();
            particles.forEach(p => p.draw());
            drawBottomArcadeBar();

            if (stateTimer < 75) {
                ctx.fillStyle = '#00e8ff';
                ctx.font = 'bold 26px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(`STAGE ${wave}`, width / 2, height / 2 - 22);
                if (stateTimer > 25 && Math.floor(stateTimer / 8) % 2 === 0) {
                    ctx.fillStyle = '#ffe000';
                    ctx.font = 'bold 20px Courier New';
                    ctx.fillText('READY!', width / 2, height / 2 + 12);
                }
            }

            if (enemies.length === 0) {
                triggerStageClear();
            } else if (!stillEntering && stateTimer > 55) {
                gameState = 'PLAYING';
                enemyShootTimer = 40;
            }

        } else if (gameState === 'PLAYING') {
            player.update();

            if (enemies.length === 0) {
                triggerStageClear();
            } else {
                const ratio = enemies.length / 40;
                const marchInterval = Math.max(4, Math.floor(4 + ratio * 22 - Math.min(8, wave)));
                marchTimer++;

                if (marchTimer >= marchInterval) {
                    marchTimer = 0;
                    marchFrame = 1 - marchFrame;
                    SFX.step();

                    const stepX = (10 + Math.min(6, wave)) * enemyDir;
                    let hitEdge = false;
                    for (const e of enemies) {
                        if ((enemyDir > 0 && e.x + e.width + stepX >= width - 16) ||
                            (enemyDir < 0 && e.x + stepX <= 16)) {
                            hitEdge = true;
                            break;
                        }
                    }
                    if (hitEdge) {
                        enemyDir *= -1;
                        for (const e of enemies) e.y += 18;
                    } else {
                        for (const e of enemies) e.x += stepX;
                    }
                }

                enemyShootTimer--;
                if (enemyShootTimer <= 0) {
                    const shooter = enemies[Math.floor(Math.random() * enemies.length)];
                    enemyBullets.push(new Bullet(
                        shooter.x + shooter.width / 2,
                        shooter.y + shooter.height,
                        0,
                        4.5 + Math.min(3.5, wave * 0.35),
                        '#ff2040',
                        false
                    ));
                    enemyShootTimer = Math.max(18, 52 - wave * 4);
                }
            }

            if (!ufo) {
                ufoTimer--;
                if (ufoTimer <= 0) {
                    ufoTimer = 500 + Math.floor(Math.random() * 300);
                    const fromLeft = Math.random() < 0.5;
                    ufo = {
                        x: fromLeft ? -25 : width + 25,
                        y: 44,
                        vx: fromLeft ? 3 : -3,
                        pts: [500, 800, 1000][Math.floor(Math.random() * 3)]
                    };
                }
            } else {
                ufo.x += ufo.vx;
                if (frames % 14 === 0) SFX.ufo();
                if (ufo.x < -40 || ufo.x > width + 40) ufo = null;
            }

            bullets.forEach(b => b.update());
            bullets = bullets.filter(b => !b.markedForDeletion);

            enemyBullets.forEach(eb => eb.update());
            enemyBullets = enemyBullets.filter(eb => !eb.markedForDeletion);

            particles.forEach(p => p.update());
            particles = particles.filter(p => p.life > 0);

            checkCollisions();

            bunkerBlocks.forEach(blk => blk.draw());
            if (ufo) drawPixelSprite(SPRITES.UFO, PALETTES.UFO, ufo.x, ufo.y, PIXEL);
            bullets.forEach(b => b.draw());
            enemyBullets.forEach(eb => eb.draw());
            enemies.forEach(e => e.draw());
            player.draw();
            particles.forEach(p => p.draw());
            drawBottomArcadeBar();

        } else if (gameState === 'STAGE_CLEAR') {
            stateTimer++;
            player.update();
            bullets.forEach(b => b.update());
            bullets = bullets.filter(b => !b.markedForDeletion);
            particles.forEach(p => p.update());
            particles = particles.filter(p => p.life > 0);

            bunkerBlocks.forEach(blk => blk.draw());
            bullets.forEach(b => b.draw());
            player.draw();
            particles.forEach(p => p.draw());
            drawBottomArcadeBar();

            const ratio = shotsFired > 0 ? Math.round((shotsHit / shotsFired) * 100) : 0;
            ctx.textAlign = 'center';
            ctx.fillStyle = '#00e8ff';
            ctx.font = 'bold 26px Courier New';
            ctx.fillText(`STAGE ${wave} CLEAR!`, width / 2, height / 2 - 48);

            ctx.fillStyle = '#ffe000';
            ctx.font = 'bold 17px Courier New';
            ctx.fillText(`SHOTS FIRED: ${shotsFired}   HITS: ${shotsHit}`, width / 2, height / 2 - 10);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`HIT-MISS RATIO: ${ratio}%`, width / 2, height / 2 + 18);

            if (stagePerfect && Math.floor(stateTimer / 6) % 2 === 0) {
                ctx.fillStyle = '#00ff55';
                ctx.font = 'bold 20px Courier New';
                ctx.fillText('PERFECT! +1000 BONUS', width / 2, height / 2 + 52);
            }

            if (stateTimer > 140) {
                wave++;
                createBunkers();
                startStageIntro();
            }

        } else if (gameState === 'PAUSED') {
            bunkerBlocks.forEach(blk => blk.draw());
            enemies.forEach(e => e.draw());
            if (player) player.draw();
            drawBottomArcadeBar();

            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#ffe000';
            ctx.font = 'bold 30px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('PAUSED', width / 2, height / 2);
        }

        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'center';
        for (let i = popups.length - 1; i >= 0; i--) {
            const pp = popups[i];
            pp.y -= 0.7;
            pp.life--;
            ctx.fillStyle = pp.color;
            ctx.fillText(pp.text, Math.round(pp.x), Math.round(pp.y));
            if (pp.life <= 0) popups.splice(i, 1);
        }

        frames++;
        requestAnimationFrame(loop);
    }

    // =========================================================================
    // CONTROLES E INICIALIZAÇÃO SEGURA
    // =========================================================================
    function togglePause() {
        if (gameState === 'PLAYING' || gameState === 'STAGE_INTRO' || gameState === 'STAGE_CLEAR') {
            pausedFromState = gameState;
            gameState = 'PAUSED';
        } else if (gameState === 'PAUSED') {
            gameState = pausedFromState;
        }
    }

    function handleStartClick(e) {
        if (e && e.currentTarget) e.currentTarget.blur();
        SFX.init();
        initGame();
    }

    window.addEventListener('keydown', e => {
        if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
        SFX.init();

        if ((gameState === 'START' || gameState === 'GAMEOVER') && (e.key === 'Enter' || e.key === ' ')) {
            initGame();
            return;
        }

        keys[e.key] = true;

        if (e.key === 'p' || e.key === 'P') togglePause();
        if (e.key === 'm' || e.key === 'M') {
            SFX.muted = !SFX.muted;
            document.getElementById('muteBtn').innerText = SFX.muted ? 'SOM: OFF' : 'SOM: ON';
        }
    });

    window.addEventListener('keyup', e => { keys[e.key] = false; });
    window.addEventListener('blur', () => {
        for (const k in keys) keys[k] = false;
        mouse.down = false;
    });

    canvas.addEventListener('mousedown', e => {
        if (e.button === 0) {
            SFX.init();
            mouse.down = true;
        }
    });
    window.addEventListener('mouseup', () => { mouse.down = false; });

    document.getElementById('startBtn').addEventListener('click', handleStartClick);
    document.getElementById('restartBtn').addEventListener('click', handleStartClick);
    document.getElementById('pauseBtn').addEventListener('click', e => {
        e.currentTarget.blur();
        togglePause();
    });
    document.getElementById('muteBtn').addEventListener('click', e => {
        e.currentTarget.blur();
        SFX.init();
        SFX.muted = !SFX.muted;
        document.getElementById('muteBtn').innerText = SFX.muted ? 'SOM: OFF' : 'SOM: ON';
    });

    initStars();
    updateHUD();
    loop();
})();
</script>
